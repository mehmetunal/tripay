# Manuel NuGet yayını (patch / minor / major seçimi)
# Otomatik yayın: CI workflow → main push → nuget-publish job
name: NuGet Publish (manuel)

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Sürüm artışı (patch / minor / major)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      skip_bump:
        description: "Sürümü artırma (--no-bump)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nuget-publish-manual
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet pack
        env:
          TRI_PAY_VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          args=(--no-push)
          if [[ "${{ inputs.skip_bump }}" == "true" ]]; then
            args+=(--no-bump)
          fi
          chmod +x build/pack-and-push.sh build/bump-nuget-version.sh
          ./build/pack-and-push.sh "${args[@]}"

      - name: nuget.org push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./build/pack-and-push.sh --push-only

      - name: Sürüm dosyasını repoya geri yaz
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/TriPay.NuGet.Version.props
          if git diff --staged --quiet; then
            exit 0
          fi
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          git commit -m "chore(nuget): sürüm ${ver} [skip ci]"
          git push

      - name: Özet
        run: |
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          echo "### Yayınlanan sürüm: \`${ver}\`" >> "$GITHUB_STEP_SUMMARY"
