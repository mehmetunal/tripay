# PR: build + test + NuGet pack doğrulama (push yok)
# main push: build + test + pack → nuget.org push → sürüm commit
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            TriPay.Web/package-lock.json
            TriPay.Admin/package-lock.json

      - name: npm ci (Tailwind / lightningcss native)
        run: |
          npm ci --prefix TriPay.Web
          npm ci --prefix TriPay.Admin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TriPay.sln

      - name: Build
        run: dotnet build TriPay.sln -c Release --no-restore -p:RunTestsOnBuild=false

      - name: Test
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet test TriPay.sln -c Release --no-build --verbosity normal

  code-quality:
    name: Analyze Code Quality
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests

      - name: Prepare Diff
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --unified=3 "origin/${{ github.base_ref }}...HEAD" > pr_diff.txt
          else
            # Push durumunda son commit'in diff'ini al (veya son iki commit arası)
            git diff --unified=3 HEAD~1 HEAD > pr_diff.txt
          fi
          echo "Diff boyutu (byte): $(wc -c < pr_diff.txt)"

      - name: Run AI Reviewer Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: python .github/scripts/ai_reviewer.py

  # PR ve main: tek job; main'de ek adımlarla push + sürüm commit
  nuget-pack:
    runs-on: ubuntu-latest
    needs: [build-test, code-quality]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    permissions:
      contents: write
    concurrency:
      group: nuget-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet pack doğrulama (PR, push yok)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x build/pack-and-push.sh
          ./build/pack-and-push.sh --pack-only

      - name: NuGet pack (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x build/pack-and-push.sh build/bump-nuget-version.sh
          ./build/pack-and-push.sh --no-push

      - name: nuget.org push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./build/pack-and-push.sh --push-only

      - name: Sürüm dosyasını repoya geri yaz (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/TriPay.NuGet.Version.props
          if git diff --staged --quiet; then
            echo "Sürüm dosyasında değişiklik yok."
            exit 0
          fi
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          git commit -m "chore(nuget): sürüm ${ver} [skip ci]"
          git push

      - name: GitHub Release oluştur (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          tag="v${ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} zaten mevcut, atlanıyor."
            exit 0
          fi
          gh release create "$tag" \
            --title "TriPay ${ver}" \
            --generate-notes

      - name: Özet (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          echo "### nuget.org yayınlandı: \`${ver}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### GitHub Release: \`v${ver}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "TriPay, TriPay.Hosted ve bağımlılıklar" >> "$GITHUB_STEP_SUMMARY"
