# PR ve main: derleme + test, ardından NuGet pack doğrulama (sıralı)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            TriPay.Web/package-lock.json
            TriPay.Admin/package-lock.json

      - name: npm ci (Tailwind / lightningcss native)
        run: |
          npm ci --prefix TriPay.Web
          npm ci --prefix TriPay.Admin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TriPay.sln

      - name: Build
        run: dotnet build TriPay.sln -c Release --no-restore -p:RunTestsOnBuild=false

      - name: Test
        run: dotnet test TriPay.sln -c Release --no-build --verbosity normal

  nuget-pack-verify:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet pack (push yok)
        run: |
          chmod +x build/pack-and-push.sh
          ./build/pack-and-push.sh --pack-only
