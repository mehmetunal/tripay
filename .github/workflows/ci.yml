# PR: build + test + NuGet pack doğrulama
# main push: build + test + nuget.org pack & push
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            TriPay.Web/package-lock.json
            TriPay.Admin/package-lock.json

      - name: npm ci (Tailwind / lightningcss native)
        run: |
          npm ci --prefix TriPay.Web
          npm ci --prefix TriPay.Admin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TriPay.sln

      - name: Build
        run: dotnet build TriPay.sln -c Release --no-restore -p:RunTestsOnBuild=false

      - name: Test
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet test TriPay.sln -c Release --no-build --verbosity normal

  # Pull request: yalnızca paketlerin derlendiğini doğrula (nuget.org'a gönderme)
  nuget-pack-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet pack doğrulama (push yok)
        run: |
          chmod +x build/pack-and-push.sh
          ./build/pack-and-push.sh --pack-only

  # main: testler geçince sürüm artır, pack + nuget.org push
  nuget-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write
    concurrency:
      group: nuget-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet pack
        run: |
          chmod +x build/pack-and-push.sh build/bump-nuget-version.sh
          ./build/pack-and-push.sh --no-push

      - name: nuget.org push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./build/pack-and-push.sh --push-only

      - name: Sürüm dosyasını repoya geri yaz
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/TriPay.NuGet.Version.props
          if git diff --staged --quiet; then
            echo "Sürüm dosyasında değişiklik yok."
            exit 0
          fi
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          git commit -m "chore(nuget): sürüm ${ver} [skip ci]"
          git push

      - name: Özet
        run: |
          ver=$(sed -n 's/.*<TriPayPackageVersion>\([^<]*\).*/\1/p' build/TriPay.NuGet.Version.props | head -n1 | tr -d '[:space:]')
          echo "### nuget.org yayınlandı: \`${ver}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "TriPay, TriPay.Framework, TriPay.Hosted ve bağımlılıklar" >> "$GITHUB_STEP_SUMMARY"
