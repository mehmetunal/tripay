# TriPay yerel geliştirme altyapısı — Redis, RabbitMQ, MSSQL
# Kullanım: docker compose up -d
# Güvenlik: Yalnızca geliştirme; üretim şifrelerini buradan kopyalamayın.

services:
  redis:
    image: redis:7-alpine
    container_name: tripay-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - tripay-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tripay-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tripay-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tripay
      RABBITMQ_DEFAULT_PASS: tripay_dev_only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - tripay-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tripay-net

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tripay-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TriPay_Dev_2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - tripay-mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TriPay_Dev_2026!" -C -Q "SELECT 1" || exit 1
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - tripay-net

volumes:
  tripay-redis-data:
  tripay-rabbitmq-data:
  tripay-mssql-data:

networks:
  tripay-net:
    driver: bridge
