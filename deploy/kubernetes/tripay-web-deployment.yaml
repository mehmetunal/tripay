apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripay-web
  namespace: tripay
  labels:
    app: tripay-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tripay-web
  template:
    metadata:
      labels:
        app: tripay-web
    spec:
      serviceAccountName: tripay-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: tripay/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: tripay-config
            - secretRef:
                name: tripay-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tripay-web
  namespace: tripay
spec:
  selector:
    app: tripay-web
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tripay-web
  namespace: tripay
